# Linux CI: typecheck, lint, unit tests and a Linux `electrobun build` smoke test.
# Linux runners only. Windows and macOS builds are GLIM-34 (they cost 2x / 10x minutes).
name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Hutch
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"

      - name: Sync the Electrobun devkit (pinned in app/hutch.config.ts)
        working-directory: app
        run: hutch electrobun sync

      - name: Typecheck
        run: bun run typecheck

      - name: Lint and format check
        run: bun run lint:ci

      - name: Unit tests
        run: bun test

      - name: Build the app (Linux)
        working-directory: app
        run: hutch electrobun build --env=dev
