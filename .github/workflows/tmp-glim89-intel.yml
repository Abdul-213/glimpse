# TEMPORARY (GLIM-89): one verification run of the darwin-x64 onnxruntime path on an Intel
# runner. Removed again before the PR is merged.
name: GLIM-89 Intel Mac check (temporary)
on:
  push:
    branches: [glim-89-intel-mac-ort]
    paths: [.github/workflows/tmp-glim89-intel.yml]
permissions:
  contents: read
jobs:
  intel:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: uname -m && sw_vers
      - run: bun install --frozen-lockfile
      - run: bun run models
      - name: Legacy onnxruntime tests (network)
        env:
          GLIMPSE_ORT_LEGACY_TEST: "1"
        run: bun test app/test/ort-legacy.test.ts
      # The OCR half of the preBuild hook (no views: they need the Electrobun devkit).
      - name: Stage the OCR Worker, onnxruntime 1.23.2 and the models
        working-directory: app
        run: |
          cat > "$RUNNER_TEMP/stage.ts" <<'TS'
          import { join } from "node:path";
          const app = process.cwd();
          const { buildWorkers } = await import(join(app, "scripts/build-workers.ts"));
          const { ortOut, ortTarget, stageOnnxRuntime } = await import(join(app, "scripts/onnxruntime.ts"));
          const { ensureLegacyOrt, ortPackageFor } = await import(join(app, "scripts/onnxruntime-legacy.ts"));
          const { defaultCacheDir, loadManifest, modelsOut, stageBundled } = await import(join(app, "scripts/model-cache.ts"));
          const target = ortTarget();
          console.log("target", target, ortPackageFor(target));
          const dir = await ensureLegacyOrt({ log: console.log });
          console.log(await buildWorkers({ dev: false, ortPackageDir: dir }));
          console.log(stageOnnxRuntime(target, ortOut, join(dir, "bin", "napi-v6")));
          console.log(await stageBundled(loadManifest(), modelsOut, { cacheDir: defaultCacheDir(), log: () => {} }));
          TS
          bun "$RUNNER_TEMP/stage.ts"
      - name: OCR smoke test (bundled onnxruntime 1.23.2)
        working-directory: app
        run: bun scripts/bundle-smoke.ts
