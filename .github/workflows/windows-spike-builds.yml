# Builds the Wave 0 Electrobun spikes on Windows and uploads each build folder
# as an artifact, so they can be tried on a real PC without a local toolchain.
#
# Runs only on a push to this CI branch (workflow_dispatch needs the file on
# main, which is not merged yet) or a manual dispatch once it is. Nothing runs
# on PRs or on pushes to other branches.
name: Windows spike builds

on:
  push:
    branches: [ci/windows-spike-builds]
    paths: [.github/workflows/windows-spike-builds.yml]
  workflow_dispatch:

concurrency:
  group: windows-spike-builds
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.spike }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { spike: overlay,           branch: glim-13-overlay-spike,           tool: hutch, build: hutch run build-dev }
          - { spike: window-materials,  branch: glim-19-window-materials-spike,  tool: hutch, build: hutch run build }
          - { spike: hotkeys,           branch: glim-14-hotkeys-spike,           tool: bun }
          - { spike: capture,           branch: glim-15-capture-spike,           tool: bun, native: true }
          - { spike: capture-exclusion, branch: glim-16-capture-exclusion-spike, tool: bun }
          - { spike: keychain,          branch: glim-18-keychain-spike,          tool: bun }
    defaults:
      run:
        shell: pwsh
        working-directory: spikes/${{ matrix.spike }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - uses: oven-sh/setup-bun@v2

      - name: Install Hutch
        if: matrix.tool == 'hutch'
        working-directory: .
        run: |
          & ([scriptblock]::Create((irm https://hutch.blackboard.sh/hutch/install.ps1)))
          "$env:USERPROFILE\.hutch\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: MSVC environment
        if: matrix.native
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install and prepare (Hutch)
        if: matrix.tool == 'hutch'
        run: |
          hutch run install
          hutch electrobun sync

      - name: Install and prepare (Bun)
        if: matrix.tool == 'bun'
        run: |
          bun install
          bun --bun run prepare:devkit

      - name: Native library
        if: matrix.native
        run: bun run native:win

      - name: Unit tests
        continue-on-error: true
        run: ${{ matrix.tool == 'hutch' && 'hutch run test' || 'bun test' }}

      - name: Build
        run: ${{ matrix.build || 'bun --bun run build' }}

      - name: List build output
        if: always()
        run: Get-ChildItem -Recurse -Include *.exe build, artifacts -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glimpse-spike-${{ matrix.spike }}-windows-x64
          path: |
            spikes/${{ matrix.spike }}/build/
            spikes/${{ matrix.spike }}/artifacts/
          if-no-files-found: warn
          retention-days: 14
