<!doctype html>
<html lang="en" data-os="macos" data-theme="light" data-veil="tint">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Glimpse popup</title>
		<link rel="stylesheet" href="index.css" />
	</head>
	<body>
		<main class="popup" aria-label="Translation">
			<ol class="blocks">
				<li class="block">
					<p class="translation" lang="en" id="t1">Save your progress before closing the game.</p>
					<p class="source" lang="ja" id="s1">ゲームを閉じる前に進行状況を保存してください。</p>
				</li>
				<li class="block">
					<p class="translation" lang="en" id="t2">Continue · Load · Settings</p>
					<p class="source" lang="ja" id="s2">つづきから · ロード · 設定</p>
				</li>
			</ol>
			<footer class="footer">
				<span class="meta" id="caption">Japanese → English · On-device</span>
				<button type="button" class="copy" id="copy">Copy</button>
			</footer>
		</main>
		<script type="module" src="./index.js"></script>
	</body>
</html>
